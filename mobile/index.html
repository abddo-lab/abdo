<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1117">
<title>Kiren Mobile</title>
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--surface:#1A1D28;--surface2:#22263A;--border:#2E3245;
  --text:#F0F2F5;--muted:#8B92A8;--accent:#6366F1;--accent2:#818CF8;
  --green:#22C55E;--red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;
  --radius:12px;--radius-lg:16px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}

/* App shell */
.app{display:flex;flex-direction:column;height:100dvh}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:17px;font-weight:700;flex:1}
.header .badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.tab-bar{display:flex;gap:2px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;position:sticky;bottom:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--muted);transition:.15s}
.tab.active{background:var(--surface2);color:var(--accent2)}
.tab svg{width:20px;height:20px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon svg{width:18px;height:18px}
.card-title{font-size:14px;font-weight:700}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

/* Progress */
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .4s}

/* Agent card */
.agent-card{display:flex;gap:12px;align-items:flex-start}
.agent-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dot-running{background:var(--blue);animation:pulse 1.5s infinite}
.dot-review{background:var(--accent)}
.dot-done{background:var(--green)}
.dot-idle{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-meta{font-size:12px;color:var(--muted);margin-top:2px}

/* Thread */
.thread-msg{padding:12px;margin-bottom:8px;border-radius:var(--radius);font-size:13px;line-height:1.5}
.msg-user{background:var(--accent);color:white;margin-left:24px;border-radius:12px 12px 4px 12px}
.msg-assistant{background:var(--surface2);margin-right:24px;border-radius:12px 12px 12px 4px}
.msg-tool{background:var(--surface);border:1px solid var(--border);font-family:monospace;font-size:12px}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s}
.btn-accent{background:var(--accent);color:white}
.btn-ghost{border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:6px 12px;font-size:12px}

/* Ring */
.ring{position:relative;width:88px;height:88px}
.ring svg{transform:rotate(-90deg)}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:18px;font-weight:800}
.ring-label{font-size:9px;color:var(--muted)}

/* List */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border:none}
.list-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-icon svg{width:16px;height:16px}
.list-text{flex:1;min-width:0}
.list-title{font-size:13px;font-weight:600}
.list-sub{font-size:11px;color:var(--muted)}

/* Toggle */
.toggle{width:44px;height:24px;border-radius:12px;background:var(--border);position:relative;flex-shrink:0;transition:.2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}
.toggle.on::after{left:22px}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 16px 32px}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px}

/* Compose */
.compose{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.compose input{flex:1}
.compose button{flex-shrink:0;width:40px;height:40px;border-radius:10px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:8px 16px;font-size:12px;font-weight:600;z-index:200;animation:toast-in .3s}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>
    <h1 id="header-title">Dashboard</h1>
    <span class="badge badge-green" id="status-badge">Connected</span>
  </div>

  <!-- Content -->
  <div class="content" id="content"></div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button class="tab" data-tab="agents" onclick="switchTab('agents')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Agents
    </button>
    <button class="tab" data-tab="automations" onclick="switchTab('automations')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Auto
    </button>
    <button class="tab" data-tab="usage" onclick="switchTab('usage')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
      Usage
    </button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>
</div>

<script>
const API = (location.hostname.includes('mobile.') ? 'http://kiren.knr.cl/api' : 'http://localhost:3001/api');
let token = localStorage.getItem('kiren_token');
let currentTab = 'dashboard';
let ws = null;

// ── API Client ──────────────────────────────────────────────
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API}${path}`, { ...opts, headers: { ...h, ...opts.headers } });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `HTTP ${res.status}`); }
  return res.json();
}

// ── WebSocket ───────────────────────────────────────────────
function connectWS() {
  if (!token) return;
  const wsUrl = API.replace('http', 'ws').replace('/api', '/ws');
  ws = new WebSocket(`${wsUrl}?token=${token}`);
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'notification') {
        showToast(msg.data.title);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(msg.data.title, { body: msg.data.body });
        }
      }
      if (msg.type === 'agent_update') renderTab(currentTab);
    } catch {}
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// ── Tab Switching ───────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('header-title').textContent = {
    dashboard: 'Dashboard', agents: 'Agents', automations: 'Automations',
    usage: 'Usage & Billing', settings: 'Settings'
  }[tab];
  renderTab(tab);
}

// ── Render Tabs ─────────────────────────────────────────────
async function renderTab(tab) {
  const el = document.getElementById('content');
  try {
    switch (tab) {
      case 'dashboard': el.innerHTML = await renderDashboard(); break;
      case 'agents': el.innerHTML = await renderAgents(); break;
      case 'automations': el.innerHTML = await renderAutomations(); break;
      case 'usage': el.innerHTML = await renderUsage(); break;
      case 'settings': el.innerHTML = renderSettings(); break;
    }
  } catch (err) {
    el.innerHTML = `<div class="empty"><p>Error: ${err.message}</p></div>`;
  }
}

// ── Dashboard ───────────────────────────────────────────────
async function renderDashboard() {
  const [threadData, usageData, notifData] = await Promise.all([
    api('/threads').catch(() => ({ threads: [] })),
    api('/billing/usage').catch(() => null),
    api('/notifications').catch(() => ({ notifications: [], unread: 0 })),
  ]);

  const threads = threadData.threads || [];
  const running = threads.filter(t => t.status === 'running').length;
  const review = threads.filter(t => t.status === 'review').length;
  const balance = usageData?.balance ?? 0;
  const monthCost = usageData?.this_month?.total_cost ?? 0;

  let html = `
    <div class="stats">
      <div class="stat"><div class="stat-value" style="color:var(--green)">$${balance.toFixed(2)}</div><div class="stat-label">Balance</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--amber)">$${monthCost.toFixed(2)}</div><div class="stat-label">This Month</div></div>
      <div class="stat"><div class="stat-value">${running}</div><div class="stat-label">Running</div></div>
      <div class="stat"><div class="stat-value">${review}</div><div class="stat-label">In Review</div></div>
    </div>`;

  if (notifData.unread > 0) {
    html += `<div class="card" style="border-color:var(--accent)">
      <div class="card-header"><div class="card-icon" style="background:rgba(99,102,241,.15)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><div><div class="card-title">${notifData.unread} new notifications</div></div></div></div>`;
  }

  html += `<h3 style="font-size:14px;font-weight:700;margin:16px 0 10px">Recent Threads</h3>`;
  if (threads.length === 0) {
    html += `<div class="empty"><p>No threads yet. Create one from the desktop app.</p></div>`;
  } else {
    for (const t of threads.slice(0, 8)) {
      const dotClass = t.status === 'running' ? 'dot-running' : t.status === 'review' ? 'dot-review' : t.status === 'done' ? 'dot-done' : 'dot-idle';
      html += `<div class="card" onclick="viewThread('${t.id}')" style="cursor:pointer">
        <div class="agent-card"><div class="agent-dot ${dotClass}"></div><div class="agent-info">
          <div class="agent-name">${esc(t.title)}</div>
          <div class="agent-meta">${esc(t.project_name || '')} · ${t.status} · ${t.model_id}</div>
        </div></div></div>`;
    }
  }
  return html;
}

// ── Agents ──────────────────────────────────────────────────
async function renderAgents() {
  const data = await api('/threads').catch(() => ({ threads: [] }));
  const threads = data.threads || [];
  const running = threads.filter(t => t.status === 'running');
  const review = threads.filter(t => t.status === 'review');
  const done = threads.filter(t => t.status === 'done');

  let html = '';
  const sections = [
    { label: 'Running', items: running, color: 'var(--blue)' },
    { label: 'In Review', items: review, color: 'var(--accent)' },
    { label: 'Completed', items: done, color: 'var(--green)' },
  ];

  for (const s of sections) {
    html += `<h3 style="font-size:13px;font-weight:700;color:${s.color};margin:16px 0 8px">${s.label} · ${s.items.length}</h3>`;
    if (s.items.length === 0) { html += `<div class="empty" style="padding:16px"><p>None</p></div>`; continue; }
    for (const t of s.items) {
      const dotClass = t.status === 'running' ? 'dot-running' : t.status === 'review' ? 'dot-review' : 'dot-done';
      html += `<div class="card" onclick="viewThread('${t.id}')" style="cursor:pointer">
        <div class="agent-card"><div class="agent-dot ${dotClass}"></div><div class="agent-info">
          <div class="agent-name">${esc(t.title)}</div>
          <div class="agent-meta">${esc(t.model_id)} · ${t.tokens_used || 0} tokens · $${(t.cost_usd || 0).toFixed(4)}</div>
          <div class="progress" style="margin-top:8px"><div class="progress-bar" style="width:${t.status === 'running' ? '60' : '100'}%;background:${s.color}"></div></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();stopThread('${t.id}')">Stop</button>
        </div></div>`;
    }
  }
  return html;
}

// ── Thread View ─────────────────────────────────────────────
async function viewThread(id) {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><p>Loading thread...</p></div>';
  try {
    const data = await api(`/threads/${id}`);
    const blocks = data.blocks || [];
    let html = `<button class="btn btn-ghost btn-sm" onclick="switchTab('agents')" style="margin-bottom:12px">← Back</button>`;
    html += `<div class="card"><div class="card-title">${esc(data.title)}</div><div class="card-sub">${esc(data.model_id)} · ${data.status}</div></div>`;
    for (const b of blocks) {
      const d = typeof b.data === 'string' ? JSON.parse(b.data) : b.data;
      if (b.kind === 'user') html += `<div class="thread-msg msg-user">${esc(d.text || '')}</div>`;
      else if (b.kind === 'text') html += `<div class="thread-msg msg-assistant">${esc(d.text || '')}</div>`;
      else if (b.kind === 'tool') html += `<div class="thread-msg msg-tool">🔧 ${esc(d.tool || '')}: ${esc(d.target || '')} — ${esc(d.status || '')}</div>`;
      else if (b.kind === 'thinking') html += `<div class="thread-msg msg-tool" style="opacity:.7">💭 Thinking...</div>`;
    }
    html += `<div class="compose"><input id="thread-input" placeholder="Reply to agent..." onkeydown="if(event.key==='Enter'){sendThreadMsg('${id}')}"><button onclick="sendThreadMsg('${id}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>`;
    el.innerHTML = html;
  } catch (err) { el.innerHTML = `<div class="empty"><p>${err.message}</p></div>`; }
}

async function sendThreadMsg(id) {
  const input = document.getElementById('thread-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  try {
    await api(`/threads/${id}/send`, { method: 'POST', body: JSON.stringify({ message: msg }) });
    viewThread(id);
    showToast('Message sent');
  } catch (err) { showToast(err.message); }
}

async function stopThread(id) {
  try { await api(`/threads/${id}/stop`, { method: 'POST' }); showToast('Agent stopped'); renderTab('agents'); }
  catch (err) { showToast(err.message); }
}

// ── Automations ─────────────────────────────────────────────
async function renderAutomations() {
  const data = await api('/automations').catch(() => ({ automations: [] }));
  const autos = data.automations || [];
  if (autos.length === 0) return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><p>No automations yet.<br>Create from desktop app.</p></div>`;
  let html = '';
  for (const a of autos) {
    const statusColor = a.status === 'running' ? 'var(--blue)' : 'var(--green)';
    html += `<div class="card">
      <div class="card-header"><div class="card-icon" style="background:rgba(99,102,241,.15)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <div><div class="card-title">${esc(a.name)}</div><div class="card-sub">${esc(a.goal || '')}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;color:${statusColor};font-weight:600">● ${a.status}</span>
        <span style="font-size:11px;color:var(--muted)">· ${a.runs} runs · ${esc(a.trigger_config || '')}</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-accent btn-sm" onclick="runAutomation('${a.id}')">▶ Run Now</button>
        <button class="btn btn-ghost btn-sm" onclick="viewAutomationThread('${a.id}')">View History</button>
      </div>
    </div>`;
  }
  return html;
}

async function runAutomation(id) {
  try { await api(`/automations/${id}/run`, { method: 'POST' }); showToast('Automation started'); }
  catch (err) { showToast(err.message); }
}

// ── Usage ───────────────────────────────────────────────────
async function renderUsage() {
  const data = await api('/billing/usage').catch(() => null);
  if (!data) return `<div class="empty"><p>Could not load usage data</p></div>`;

  const balance = data.balance ?? 0;
  const monthCost = data.this_month?.total_cost ?? 0;
  const tokens = data.this_month?.total_tokens ?? 0;
  const todayCost = data.today_cost ?? 0;
  const byModel = data.by_model || [];

  const balancePct = Math.min(100, Math.round((monthCost / Math.max(balance + monthCost, 1)) * 100));

  let html = `
    <div style="display:flex;justify-content:center;gap:24px;margin-bottom:20px">
      <div class="ring">
        <svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="var(--surface2)" stroke-width="6"/><circle cx="44" cy="44" r="36" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${2*Math.PI*36*balancePct/100} ${2*Math.PI*36}" style="transition:stroke-dasharray .6s"/></svg>
        <div class="ring-text"><div class="ring-pct">${balancePct}%</div><div class="ring-label">used</div></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-value" style="color:var(--green)">$${balance.toFixed(2)}</div><div class="stat-label">Balance</div></div>
      <div class="stat"><div class="stat-value" style="color:var(--amber)">$${monthCost.toFixed(2)}</div><div class="stat-label">Month Spend</div></div>
      <div class="stat"><div class="stat-value">$${todayCost.toFixed(2)}</div><div class="stat-label">Today</div></div>
      <div class="stat"><div class="stat-value">${(tokens/1000).toFixed(0)}k</div><div class="stat-label">Tokens</div></div>
    </div>`;

  if (byModel.length > 0) {
    html += `<div class="card"><div class="card-title" style="margin-bottom:12px">Cost by Model</div>`;
    const maxCost = Math.max(...byModel.map(m => m.cost));
    for (const m of byModel.slice(0, 8)) {
      const pct = maxCost > 0 ? Math.round((m.cost / maxCost) * 100) : 0;
      html += `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted)">${esc(m.model_id)}</span><span style="font-weight:600">$${m.cost.toFixed(4)}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%;background:var(--accent)"></div></div></div>`;
    }
    html += `</div>`;
  }
  return html;
}

// ── Settings ────────────────────────────────────────────────
function renderSettings() {
  return `
    <div class="card"><div class="card-header"><div class="card-icon" style="background:rgba(99,102,241,.15)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div><div class="card-title">Account</div><div class="card-sub">Signed in</div></div></div>
    <button class="btn btn-ghost" style="width:100%" onclick="logout()">Sign Out</button></div>

    <div class="card"><div class="card-title" style="margin-bottom:12px">Notifications</div>
    <div class="list-item"><div class="list-text"><div class="list-title">Desktop Notifications</div><div class="list-sub">Alert when agents finish</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
    <div class="list-item"><div class="list-text"><div class="list-title">Sound Effects</div><div class="list-sub">Play sounds on events</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
    </div>

    <div class="card"><div class="card-title" style="margin-bottom:12px">App Info</div>
    <div class="list-item"><div class="list-text"><div class="list-title">Version</div></div><span style="font-size:12px;color:var(--muted)">2.6.0</span></div>
    <div class="list-item"><div class="list-text"><div class="list-title">Server</div></div><span style="font-size:12px;color:var(--muted)">kiren.knr.cl</span></div>
    </div>`;
}

function logout() {
  localStorage.removeItem('kiren_token');
  token = null;
  if (ws) ws.close();
  location.reload();
}

// ── Utils ───────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── Init ────────────────────────────────────────────────────
async function init() {
  if (!token) {
    document.getElementById('content').innerHTML = `
      <div class="empty" style="padding-top:60px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/></svg>
        <p style="font-size:16px;font-weight:700;margin-top:16px;color:var(--text)">Welcome to Kiren</p>
        <p style="margin-top:8px">Sign in from the desktop app first,<br>then scan the QR code to connect.</p>
        <button class="btn btn-accent" style="margin-top:20px" onclick="demoLogin()">Try Demo Login</button>
      </div>`;
    return;
  }
  connectWS();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  switchTab('dashboard');
}

async function demoLogin() {
  try {
    const data = await api('/auth/demo-login', { method: 'POST' });
    token = data.token;
    localStorage.setItem('kiren_token', token);
    init();
  } catch (err) { showToast(err.message); }
}

init();
</script>
</body>
</html>
